[project]
name = "compliance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yr08ii", email = "salvadorchimbutane@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "prefect>=3.7.8",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
compliance = "compliance:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
